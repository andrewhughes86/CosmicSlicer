[workspace]
exclude = ["vendor"]
resolver = "3"
members = [
    "apps/CosmicSlicer",
    "crates/config",
    "crates/connect",
    "crates/engine",
    "crates/import",
    "crates/model",
    "crates/ui-egui",
]
default-members = ["apps/CosmicSlicer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[workspace.dependencies]
CosmicSlicer-config = { path = "crates/config" }
CosmicSlicer-connect = { path = "crates/connect" }
CosmicSlicer-engine = { path = "crates/engine" }
CosmicSlicer-import = { path = "crates/import" }
CosmicSlicer-model = { path = "crates/model" }
CosmicSlicer-ui-egui = { path = "crates/ui-egui" }

base64 = "0.22"
bytemuck = { version = "1.25", features = ["derive"] }
eframe = { version = "0.36.2", default-features = false }
egui = "0.36.2"
egui-wgpu = "0.36.2"
epaint_default_fonts = "0.36.2"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
boostvoronoi = "0.12"
glam = "0.30"
log = "0.4"
miniz_oxide = "0.8"
png = "0.18"
quick-xml = "0.41"
rayon = "1.10"
regex = { version = "1.11", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
resvg = { version = "=0.48.1", default-features = false }
rfd = "0.17.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
skrifa = { version = "0.44", default-features = false, features = ["std"] }
serde_json = "1"
spade = "2.15"
robust = "1.2"
thiserror = "2"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
webpki-roots = "0.26"
wgpu = { version = "30", default-features = false }

[profile.release]
debug = "line-tables-only"

# Mesh loading, picking and slicing crawl unoptimised.
[profile.dev.package.CosmicSlicer-model]
opt-level = 2

[profile.dev.package.CosmicSlicer-engine]
opt-level = 2

[profile.dev.package.CosmicSlicer-import]
opt-level = 2

[profile.dev.package.spade]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

# A fixed seed in its skip list, so the Voronoi diagrams repeat (see vendor/cpp_map).
[patch.crates-io]
cpp_map = { path = "vendor/cpp_map" }
